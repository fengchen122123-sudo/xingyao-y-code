# dsh-desktop-shell bundle patch: opens the web GUI in a native WebView2
# window once the webserver is up.
#
# Mount this bundle in a WEB profile (dsh plugin --profile web add ...).
# The plugin itself never requires the webServer service, so on a profile
# without a webserver it simply does nothing at boot — but the desktop window
# only makes sense where the web surface exists, so keep it to web profiles.
- insert:
    - id: desktop-shell
      name: 'dsh-desktop-shell'
      config:
        # Open the window automatically when the profile boots.
        autoOpen: true
        # Window chrome.
        title: DeepSeek Harness
        width: 1320
        height: 860
        # What happens when the window closes: 'shutdown' exits dsh,
        # 'keep' leaves the server running (reopen with a browser).
        closeAction: shutdown
        # Skin the served page with the ycode theme (warm-neutral palette).
        # 'ycode' injects the theme via the webserver index tap; 'none' keeps
        # the stock DeepSeek theme.
        theme: ycode
        # Default theme preference written to the host settings on first boot
        # (ycode defaults to dark). 'keep' never touches the setting.
        themeMode: dark
