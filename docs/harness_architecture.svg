<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060" viewBox="0 0 1240 1060" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#455a64"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="1240" height="1060" fill="#fafafa"/>

  <text x="620" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#212121">Y-code Harness 系统架构图</text>

  <!-- ============ 接入层 ============ -->
  <text x="60" y="82" font-size="14" font-weight="bold" fill="#757575">接入层</text>
  <rect x="380" y="62" width="200" height="64" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="480" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">CLI / TUI</text>
  <text x="480" y="110" text-anchor="middle" font-size="12" fill="#1565c0">main.py</text>
  <rect x="660" y="62" width="200" height="64" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="760" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">GUI 前端</text>
  <text x="760" y="110" text-anchor="middle" font-size="12" fill="#1565c0">gui_main.py / gui_bridge.py</text>

  <!-- ============ 服务层 ============ -->
  <text x="60" y="188" font-size="14" font-weight="bold" fill="#757575">服务层</text>
  <rect x="460" y="168" width="320" height="56" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="620" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a148c">core/agent_service.py</text>
  <text x="620" y="212" text-anchor="middle" font-size="12" fill="#6a1b9a">对话服务（CLI / GUI 共源）</text>

  <!-- ============ 编排层 ============ -->
  <text x="60" y="272" font-size="14" font-weight="bold" fill="#757575">回合编排层 · core/llm.py</text>
  <rect x="340" y="252" width="540" height="120" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <rect x="362" y="284" width="220" height="62" rx="8" fill="#ffffff" stroke="#f9a825" stroke-width="1.5"/>
  <text x="472" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">run_model_turn</text>
  <text x="472" y="328" text-anchor="middle" font-size="11" fill="#ef6c00">事件化入口（TurnEvent 流）</text>
  <rect x="622" y="284" width="236" height="62" rx="8" fill="#ffffff" stroke="#f9a825" stroke-width="1.5"/>
  <text x="740" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">_chat_with_model_generator</text>
  <text x="740" y="320" text-anchor="middle" font-size="11" fill="#ef6c00">主循环 ≤100 轮 · API 重试 ×5</text>
  <text x="740" y="336" text-anchor="middle" font-size="11" fill="#ef6c00">取消打捞 · 异常收口</text>

  <!-- ============ Provider ============ -->
  <rect x="950" y="262" width="230" height="80" rx="40" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="1065" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">☁ Provider</text>
  <text x="1065" y="312" text-anchor="middle" font-size="11" fill="#2e7d32">LiteLLM</text>
  <text x="1065" y="328" text-anchor="middle" font-size="11" fill="#2e7d32">Chat / Responses 协议</text>

  <!-- ============ Harness 内核 ============ -->
  <rect x="40" y="410" width="1160" height="330" rx="12" fill="#e1f5fe" stroke="#0288d1" stroke-width="2.5"/>
  <text x="620" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#01579b">🧭 Harness 固定内核 · core/harness/（非插件化 · 严格状态机）</text>

  <!-- 行1 -->
  <rect x="70" y="456" width="340" height="64" rx="8" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/>
  <text x="240" y="480" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579b">runtime.py</text>
  <text x="240" y="500" text-anchor="middle" font-size="11" fill="#0277bd">TurnRuntime / StepRuntime 驱动状态机</text>

  <rect x="450" y="456" width="340" height="64" rx="8" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/>
  <text x="620" y="480" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579b">models.py</text>
  <text x="620" y="500" text-anchor="middle" font-size="11" fill="#0277bd">Turn/Step 迁移表 · 非法迁移即抛错</text>

  <rect x="830" y="456" width="340" height="64" rx="8" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/>
  <text x="1000" y="474" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579b">journal.py</text>
  <text x="1000" y="492" text-anchor="middle" font-size="11" fill="#0277bd">owner 租约心跳 2s / 过期 10s</text>
  <text x="1000" y="508" text-anchor="middle" font-size="11" fill="#0277bd">崩溃恢复 · 乐观并发校验</text>

  <!-- 行2 -->
  <rect x="70" y="540" width="340" height="64" rx="8" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/>
  <text x="240" y="564" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579b">request_envelope.py</text>
  <text x="240" y="584" text-anchor="middle" font-size="11" fill="#0277bd">请求指纹 SHA256 · 重试 attempt 递增</text>

  <rect x="450" y="540" width="340" height="64" rx="8" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/>
  <text x="620" y="564" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579b">stream_assembler.py</text>
  <text x="620" y="584" text-anchor="middle" font-size="11" fill="#0277bd">流式 chunk 增量组装</text>

  <rect x="830" y="540" width="340" height="64" rx="8" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/>
  <text x="1000" y="558" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579b">progress_guard.py</text>
  <text x="1000" y="576" text-anchor="middle" font-size="11" fill="#0277bd">连续 6 步停滞熔断</text>
  <text x="1000" y="592" text-anchor="middle" font-size="11" fill="#0277bd">每回合 12 个新读取预算</text>

  <!-- 行3 -->
  <rect x="70" y="624" width="340" height="80" rx="8" fill="#ffffff" stroke="#0288d1" stroke-width="2"/>
  <text x="240" y="648" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579b">tool_pipeline.py</text>
  <text x="240" y="666" text-anchor="middle" font-size="11" fill="#0277bd">JSON 修复 · RepeatCallGuard 去重</text>
  <text x="240" y="682" text-anchor="middle" font-size="11" fill="#0277bd">权限判定 · 计划约束 · 并行批次执行</text>

  <rect x="450" y="624" width="340" height="80" rx="8" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/>
  <text x="620" y="654" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579b">tool_contracts.py</text>
  <text x="620" y="674" text-anchor="middle" font-size="11" fill="#0277bd">resolve_tool：registry 优先 / MCP 兜底</text>

  <rect x="830" y="624" width="340" height="80" rx="8" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/>
  <text x="1000" y="648" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579b">tool_adapters.py</text>
  <text x="1000" y="666" text-anchor="middle" font-size="11" fill="#0277bd">内置工具适配（read/write/edit…）</text>
  <text x="1000" y="682" text-anchor="middle" font-size="11" fill="#0277bd">sandbox 路径守卫</text>

  <!-- ============ 工具生态 ============ -->
  <rect x="40" y="790" width="560" height="200" rx="10" fill="#fbe9e7" stroke="#e64a19" stroke-width="1.5"/>
  <text x="320" y="818" text-anchor="middle" font-size="15" font-weight="bold" fill="#bf360c">🔧 工具生态</text>
  <rect x="70" y="840" width="240" height="64" rx="8" fill="#ffffff" stroke="#e64a19" stroke-width="1.5"/>
  <text x="190" y="866" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">ToolRegistry</text>
  <text x="190" y="886" text-anchor="middle" font-size="11" fill="#d84315">core/tool_registry.py（内置工具）</text>
  <rect x="340" y="840" width="230" height="64" rx="8" fill="#ffffff" stroke="#e64a19" stroke-width="1.5"/>
  <text x="455" y="866" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">MCP 外部进程</text>
  <text x="455" y="886" text-anchor="middle" font-size="11" fill="#d84315">schema 解析 + 同步调用</text>
  <rect x="190" y="924" width="260" height="52" rx="8" fill="#ffffff" stroke="#e64a19" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="320" y="946" text-anchor="middle" font-size="12" font-weight="bold" fill="#bf360c">插件 Plugins</text>
  <text x="320" y="964" text-anchor="middle" font-size="10" fill="#d84315">只注册工具，不得替换 Harness 阶段</text>

  <!-- ============ 持久层 ============ -->
  <rect x="640" y="790" width="560" height="200" rx="10" fill="#efebe9" stroke="#6d4c41" stroke-width="1.5"/>
  <text x="920" y="818" text-anchor="middle" font-size="15" font-weight="bold" fill="#4e342e">💾 持久层 · core/memory.py + SQLite</text>
  <rect x="670" y="840" width="250" height="100" rx="8" fill="#ffffff" stroke="#6d4c41" stroke-width="1.5"/>
  <text x="795" y="868" text-anchor="middle" font-size="13" font-weight="bold" fill="#4e342e">messages 表</text>
  <text x="795" y="890" text-anchor="middle" font-size="11" fill="#5d4037">会话内容唯一事实源</text>
  <text x="795" y="908" text-anchor="middle" font-size="11" fill="#5d4037">正文 / 工具结果 / 推理</text>
  <rect x="950" y="840" width="220" height="100" rx="8" fill="#ffffff" stroke="#6d4c41" stroke-width="1.5"/>
  <text x="1060" y="862" text-anchor="middle" font-size="13" font-weight="bold" fill="#4e342e">harness_* 表</text>
  <text x="1060" y="882" text-anchor="middle" font-size="10" fill="#5d4037">turns / steps / events / owners</text>
  <text x="1060" y="900" text-anchor="middle" font-size="10" fill="#5d4037">只记状态·ID·哈希·耗时</text>
  <text x="1060" y="916" text-anchor="middle" font-size="10" fill="#c62828">严禁写正文 / 凭据</text>

  <!-- ============ 箭头 ============ -->
  <!-- 接入层 -> 服务层 -->
  <line x1="480" y1="126" x2="560" y2="168" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="126" x2="680" y2="168" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 服务层 -> 编排层 -->
  <line x1="620" y1="224" x2="540" y2="284" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 编排层内部 -->
  <line x1="582" y1="315" x2="622" y2="315" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 编排层 -> Harness runtime -->
  <line x1="740" y1="346" x2="300" y2="456" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- 编排层 -> Provider -->
  <line x1="880" y1="300" x2="950" y2="300" stroke="#43a047" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Provider -> stream_assembler -->
  <line x1="1020" y1="342" x2="680" y2="540" stroke="#43a047" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <!-- runtime -> models -->
  <line x1="410" y1="488" x2="450" y2="488" stroke="#0288d1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- runtime -> journal -->
  <line x1="240" y1="520" x2="900" y2="580" stroke="#0288d1" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <!-- pipeline -> contracts -->
  <line x1="410" y1="650" x2="450" y2="650" stroke="#0288d1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- adapters -> pipeline（被调用） -->
  <line x1="830" y1="686" x2="410" y2="690" stroke="#0288d1" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <!-- contracts -> registry / MCP -->
  <line x1="560" y1="704" x2="230" y2="840" stroke="#e64a19" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="704" x2="470" y2="840" stroke="#e64a19" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- plugins - -> registry -->
  <line x1="250" y1="924" x2="200" y2="904" stroke="#e64a19" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <!-- journal -> harness_* 表 -->
  <line x1="1030" y1="520" x2="1030" y2="740" stroke="#6d4c41" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1030" y1="740" x2="1050" y2="840" stroke="#6d4c41" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- runtime -> messages（commit_messages 原子落库） -->
  <line x1="140" y1="520" x2="700" y2="838" stroke="#6d4c41" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="380" y="700" font-size="11" fill="#6d4c41" transform="rotate(33 380 700)">commit_messages 原子落库</text>

  <!-- 图例 -->
  <rect x="40" y="1010" width="1160" height="36" rx="6" fill="#eceff1" stroke="#b0bec5"/>
  <line x1="70" y1="1028" x2="110" y2="1028" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="118" y="1032" font-size="12" fill="#37474f">主调用链</text>
  <line x1="210" y1="1028" x2="250" y2="1028" stroke="#455a64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="258" y="1032" font-size="12" fill="#37474f">数据流 / 注册</text>
  <line x1="390" y1="1028" x2="430" y2="1028" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="438" y="1032" font-size="12" fill="#37474f">状态机驱动</text>
  <text x="560" y="1032" font-size="12" fill="#37474f">实线框 = 代码模块　虚线框 = 外部扩展点</text>
</svg>
