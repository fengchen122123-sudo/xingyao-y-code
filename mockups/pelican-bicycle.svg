<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee3f5"/>
      <stop offset="0.6" stop-color="#d9f2fb"/>
      <stop offset="1" stop-color="#fdf6d8"/>
    </linearGradient>
    <linearGradient id="bodyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f6f2"/>
      <stop offset="1" stop-color="#eceae4"/>
    </linearGradient>
    <linearGradient id="eggGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7c4"/>
      <stop offset="1" stop-color="#ffe59a"/>
    </linearGradient>
    <linearGradient id="bikeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6dd8"/>
      <stop offset="1" stop-color="#2b4f9e"/>
    </linearGradient>
    <linearGradient id="pelicanBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b5fc0"/>
      <stop offset="1" stop-color="#3a6dd8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2c2c2a" flood-opacity="0.14"/>
    </filter>
    <filter id="softSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2c2c2a" flood-opacity="0.10"/>
    </filter>
    <style>
      /* 鹈鹕骑行小动画（SMIL，浏览器原生支持） */
      .pelican-body { animation: bob 1.6s ease-in-out infinite alternate; transform-origin: 460px 350px; }
      .pelican-tail { animation: tailSway 1.6s ease-in-out infinite alternate; transform-origin: 520px 300px; }
      .pelican-neck { animation: neckTilt 1.6s ease-in-out infinite alternate; transform-origin: 380px 320px; }
      .pelican-head { animation: headTurn 1.6s ease-in-out infinite alternate; transform-origin: 225px 300px; }
      .pelican-wing-left { animation: flapLeft 1.1s ease-in-out infinite alternate; transform-origin: 500px 330px; }
      .pelican-wing-left-inner { animation: flapInnerL 1.1s ease-in-out infinite alternate; transform-origin: 500px 330px; }
      .pelican-wing-right { animation: flapRight 1.1s ease-in-out infinite alternate; transform-origin: 540px 320px; }
      .pelican-wing-right-inner { animation: flapInnerR 1.1s ease-in-out infinite alternate; transform-origin: 540px 320px; }
      .pelican-leg-left { animation: legKick 1.6s ease-in-out infinite alternate; }
      .pelican-leg-right { animation: legKickR 1.6s ease-in-out infinite alternate; }
      .pelican-eye-left { animation: blink 3.4s ease-in-out infinite; }
      .pelican-eye-right { animation: blinkR 3.4s ease-in-out infinite; }
      .bike { animation: bikeMove 1.4s linear infinite; }
      .bike-mirror { animation: none; }
      .bike-wheel { animation: none; }
      .bike-trail path { animation: trailFade 1.4s linear infinite; }
      .bike-trail path { animation: trailFade 1.4s linear infinite; }
      .trail-1 { animation-delay: 0s; }
      .trail-2 { animation-delay: 0.35s; }
      .trail-3 { animation-delay: 0.7s; }
      @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-10px); } }
      @keyframes tailSway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
      @keyframes neckTilt { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
      @keyframes headTurn { from { transform: rotate(4deg); } to { transform: rotate(-5deg); } }
      @keyframes flapLeft { from { transform: scaleX(1); } to { transform: scaleX(1.12); } }
      @keyframes flapInnerL { from { transform: rotate(-9deg); } to { transform: rotate(10deg); } }
      @keyframes flapRight { from { transform: scaleX(1); } to { transform: scaleX(1.12); } }
      @keyframes flapInnerR { from { transform: rotate(9deg); } to { transform: rotate(-10deg); } }
      @keyframes legKick { 0% { transform: translateY(0); } 50% { transform: translateY(10px); } 100% { transform: translateY(0); } }
      @keyframes legKickR { 0% { transform: translateY(0); } 50% { transform: translateY(9px); } 100% { transform: translateY(0); } }
      @keyframes blink { 0%, 92%, 100% { opacity: 1; } 95% { opacity: 0.15; } }
      @keyframes blinkR { 0%, 88%, 100% { opacity: 1; } 91% { opacity: 0.15; } }
      @keyframes bikeMove { from { transform: translate(0, 0); } to { transform: translate(-40px, 0); } }
      @keyframes trailFade { 0% { opacity: 0.85; } 100% { opacity: 0; } }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#sky)"/>
  <rect x="0" y="470" width="1280" height="250" fill="url(#bodyBg)"/>
  <circle cx="1120" cy="90" r="46" fill="#fff3b0" opacity="0.9"/>
  <circle cx="1085" cy="75" r="34" fill="#fff8dc" opacity="0.85"/>
  <circle cx="1150" cy="120" r="16" fill="#fff8dc" opacity="0.7"/>

  <!-- 草地 -->
  <g fill="#a8cf8a">
    <ellipse cx="140" cy="600" rx="120" ry="26"/>
    <ellipse cx="240" cy="640" rx="90" ry="18"/>
    <ellipse cx="1080" cy="640" rx="130" ry="24"/>
    <ellipse cx="1160" cy="600" rx="80" ry="16"/>
    <ellipse cx="420" cy="620" rx="70" ry="14"/>
    <ellipse cx="980" cy="620" rx="60" ry="12"/>
  </g>
  <g stroke="#8fbc6e" stroke-width="2" fill="none" opacity="0.8">
    <path d="M120 560 Q 260 520 340 560"/>
    <path d="M1020 540 Q 1160 520 1250 560"/>
    <path d="M430 590 Q 470 560 500 590"/>
  </g>
  <g fill="#fff" opacity="0.85">
    <g transform="translate(320,150)">
      <circle cx="0" cy="0" r="7" fill="#ff8fb3"/>
      <circle cx="-13" cy="8" r="6" fill="#ff8fb3"/>
      <circle cx="13" cy="8" r="6" fill="#ff8fb3"/>
      <circle cx="0" cy="16" r="8" fill="#ffb3c6"/>
      <circle cx="-17" cy="20" r="7" fill="#ff9fbd"/>
    </g>
    <g transform="translate(880,110)" opacity="0.9">
      <circle cx="0" cy="0" r="6" fill="#ff9fbd"/>
      <circle cx="-11" cy="7" r="5" fill="#ff9fbd"/>
      <circle cx="11" cy="7" r="5" fill="#ff9fbd"/>
    </g>
  </g>

  <!-- 远处的树 -->
  <g fill="#b9c9a8" opacity="0.55">
    <path d="M760 470 L 830 380 L 900 470 Z"/>
    <path d="M820 470 L 880 400 L 940 470 Z"/>
    <rect x="826" y="470" width="10" height="30" rx="4"/>
  </g>

  <!-- ============== 鹈鹕 ============== -->
  <g filter="url(#softSm)">
    <!-- 尾巴（向右后方翘起，动态） -->
    <g class="pelican-tail">
      <path d="M520 300 C 560 250 640 250 680 290 C 650 320 560 330 520 310 Z" fill="url(#pelicanBody)"/>
      <path d="M545 300 C 580 275 630 280 660 305 C 620 325 560 325 540 312 Z" fill="#b79ae0" opacity="0.7"/>
      <path d="M600 318 C 640 305 685 315 705 340 C 660 355 590 350 575 332 Z" fill="#b79ae0" opacity="0.6"/>
    </g>
    <!-- 身体（向右翘起，动态） -->
    <g class="pelican-body">
      <path d="M400 340 C 470 280 570 260 660 300 C 640 345 520 380 430 355 Z" fill="url(#pelicanBody)"/>
      <path d="M560 320 C 630 290 700 295 735 330 C 690 355 600 350 575 330 Z" fill="#8f6fd0"/>
      <ellipse cx="430" cy="350" rx="70" ry="34" fill="#a581e8"/>
      <ellipse cx="470" cy="325" rx="40" ry="20" fill="#c9b3f2" opacity="0.85"/>
    </g>
    <!-- 脖子与头（头部朝向左后方） -->
    <g class="pelican-neck">
      <path d="M380 320 C 320 300 270 290 230 305 C 260 330 340 345 400 335 Z" fill="#9b74d4"/>
    </g>
    <g class="pelican-head" transform="translate(225,300)">
      <ellipse cx="0" cy="0" rx="34" ry="26" fill="#b79ae0"/>
      <ellipse cx="-8" cy="-6" rx="13" ry="10" fill="#fff" opacity="0.35"/>
      <circle cx="16" cy="-10" r="4" fill="#fff" opacity="0.5"/>
      <circle cx="-18" cy="8" r="3" fill="#fff" opacity="0.45"/>
      <path d="M22 8 Q 30 4 30 -2" stroke="#7a58b8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="30" cy="-4" r="2" fill="#7a58b8"/>
      <path d="M-22 10 Q -30 14 -34 10" stroke="#7a58b8" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M-30 10 Q -38 6 -40 10" stroke="#7a58b8" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M-44 12 Q -50 8 -52 12" stroke="#7a58b8" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 翅膀（大幅张开，左右交替） -->
    <g class="pelican-wing-left" transform="translate(500,330)">
      <g class="pelican-wing-left-inner">
        <path d="M0 0 C -60 -40 -130 -30 -165 15 C -120 40 -40 45 10 20 Z" fill="#9b74d4"/>
        <path d="M-20 -12 C -55 -38 -105 -28 -138 12 C -100 32 -35 34 -8 18 Z" fill="#c9b3f2" opacity="0.9"/>
        <path d="M40 22 C -5 40 -45 42 -80 28 C -45 -2 -5 -6 30 -2 Z" fill="#b79ae0" opacity="0.75"/>
      </g>
    </g>
    <g class="pelican-wing-right" transform="translate(540,320)">
      <g class="pelican-wing-right-inner">
        <path d="M0 0 C -55 -45 -125 -35 -160 10 C -115 38 -40 42 8 18 Z" fill="#8f6fd0"/>
        <path d="M-15 -10 C -50 -36 -100 -26 -132 12 C -96 34 -35 36 -10 20 Z" fill="#b79ae0" opacity="0.9"/>
        <path d="M45 24 C -5 42 -45 44 -78 30 C -42 -2 -8 -8 32 -4 Z" fill="#a581e8" opacity="0.8"/>
      </g>
    </g>
    <!-- 腿（两条，轻微跷跷步） -->
    <g class="pelican-leg-left" transform="translate(395,365)">
      <path d="M0 0 L 0 34" stroke="#4a3b63" stroke-width="6" stroke-linecap="round"/>
      <path d="M-8 10 L 8 8" stroke="#4a3b63" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g class="pelican-leg-right" transform="translate(520,368)">
      <path d="M0 0 L 0 34" stroke="#4a3b63" stroke-width="6" stroke-linecap="round"/>
      <path d="M-8 10 L 8 8" stroke="#4a3b63" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- 脸颊红晕 -->
    <ellipse cx="205" cy="20" rx="10" ry="6" fill="#ff9fb2" opacity="0.5"/>
    <ellipse cx="240" cy="24" rx="9" ry="5" fill="#ff9fb2" opacity="0.45"/>
    <!-- 眼睛 -->
    <circle class="pelican-eye-left" cx="196" cy="-6" r="4" fill="#2c2c2a"/>
    <circle class="pelican-eye-right" cx="246" cy="-4" r="4" fill="#2c2c2a"/>
    <circle cx="198" cy="-8" r="1.6" fill="#fff"/>
    <circle cx="248" cy="-6" r="1.6" fill="#fff"/>
  </g>

  <!-- ============== 鹈鹕蛋（前方） ============== -->
  <g filter="url(#softSm)" transform="translate(820,520)">
    <path d="M-55 30 C -45 -40 -15 -52 10 -30 C 30 -10 30 15 0 40 C -30 15 -55 15 -55 30 Z" fill="url(#eggGrad)"/>
    <path d="M-20 -25 C -10 -38 5 -40 12 -28" stroke="#e8b84b" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M15 -10 C 22 -20 24 -30 20 -38" stroke="#e8b84b" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M-30 -5 C -38 -14 -40 -24 -36 -32" stroke="#e8b84b" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-5" cy="8" rx="16" ry="8" fill="#fff" opacity="0.35"/>
  </g>

  <!-- ============== 自行车（右侧，带速度线） ============== -->
  <g class="bike" transform="translate(880,560)">
    <!-- 后视镜 -->
    <g class="bike-mirror" transform="translate(120,0)">
      <rect x="0" y="-8" width="16" height="16" rx="8" fill="url(#bikeBody)"/>
      <rect x="14" y="-6" width="7" height="12" rx="3.5" fill="#2b4f9e"/>
    </g>
    <!-- 车把 -->
    <path d="M-20 10 L -55 -18" stroke="url(#bikeBody)" stroke-width="9" stroke-linecap="round"/>
    <path d="M-55 -18 L -68 -30" stroke="#2b4f9e" stroke-width="7" stroke-linecap="round"/>
    <!-- 车架 -->
    <g fill="none" stroke="url(#bikeBody)" stroke-width="8" stroke-linecap="round">
      <path d="M-62 -30 L 30 -34 L 52 -8 L 30 18 L -30 16"/>
      <path d="M30 -34 L 40 -46"/>
      <path d="M30 18 L 40 30"/>
      <path d="M-30 16 C -10 20 -2 18 6 12"/>
    </g>
    <!-- 车轮 -->
    <g class="bike-wheel" transform="translate(40,10)">
      <circle cx="0" cy="0" r="30" fill="#2c2c2a"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#f4f4f1" stroke-width="5"/>
      <path d="M-24 -16 L 24 16" stroke="#f4f4f1" stroke-width="4" stroke-linecap="round"/>
      <path d="M-24 16 L 24 -16" stroke="#f4f4f1" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="5" fill="#f4f4f1"/>
    </g>
    <g class="bike-wheel" transform="translate(95,10)">
      <circle cx="0" cy="0" r="30" fill="#2c2c2a"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#f4f4f1" stroke-width="5"/>
      <path d="M-24 -16 L 24 16" stroke="#f4f4f1" stroke-width="4" stroke-linecap="round"/>
      <path d="M-24 16 L 24 -16" stroke="#f4f4f1" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="5" fill="#f4f4f1"/>
    </g>
    <!-- 车座杆后伸（骑行姿态） -->
    <path d="M-68 -30 C -95 -38 -115 -30 -128 -12" stroke="url(#bikeBody)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- 车头车把前方 -->
    <path d="M52 -8 L 78 -20" stroke="url(#bikeBody)" stroke-width="9" stroke-linecap="round"/>
    <rect x="70" y="-26" width="14" height="12" rx="6" fill="url(#bikeBody)"/>
    <!-- 车座垫 -->
    <ellipse cx="18" cy="14" rx="16" ry="10" fill="#f4f4f1"/>
    <!-- 车把横杠 -->
    <path d="M-10 16 L 26" stroke="#2b4f9e" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- 速度线 -->
  <g class="bike-trail" stroke="#f4f4f1" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
    <path class="trail-1" d="M-40 520 L -130 520"/>
    <path class="trail-2" d="M-70 540 L -160 540"/>
    <path class="trail-3" d="M-30 560 L -120 560"/>
  </g>
</svg>
