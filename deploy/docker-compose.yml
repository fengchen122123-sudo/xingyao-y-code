# P1 单账号。P2 起 worker 由网关按账号动态创建，不再写死在这里。
services:
  worker:
    image: xingyao-worker:${YCODE_VERSION:-local}
    container_name: xingyao-worker-local
    user: "10001:10001"
    networks: [xingyao]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    shm_size: 1g
    environment:
      TZ: Asia/Shanghai
      YCODE_DATA_DIR: /data
      YCODE_TOOL_PROFILE: server
      YCODE_SERVE_BIND: 0.0.0.0
      YCODE_SERVE_PORT: "8766"
    volumes:
      - ./accounts/local/data:/data
  caddy:
    image: caddy:2
    networks: [xingyao]
    ports:
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      SITE_DOMAIN: ${SITE_DOMAIN}
      BASIC_USER: ${BASIC_USER}
      BASIC_HASH: ${BASIC_HASH}
      WORKER_TOKEN: ${WORKER_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-logs:/var/log/caddy

networks:
  xingyao:
    name: xingyao

volumes:
  caddy-data:
  caddy-logs:
