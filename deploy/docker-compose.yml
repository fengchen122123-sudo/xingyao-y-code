# P2。worker 由网关按账号创建，不在这里写死，也不把 8766 发布到宿主机。
services:
  gateway:
    image: python:3.12-slim
    networks: [xingyao]
    working_dir: /srv/xingyao
    command: python -m uvicorn gateway.app:app_from_env --factory --host 0.0.0.0 --port 8080
    environment:
      TZ: Asia/Shanghai
      XINGYAO_JWT_SECRET: ${XINGYAO_JWT_SECRET}
      XINGYAO_GATEWAY_DIR: /srv/xingyao/gateway
      XINGYAO_ACCOUNTS_ROOT: /srv/xingyao/accounts
    volumes:
      - ..:/srv/xingyao
      - gateway-data:/srv/xingyao/gateway
      - /var/run/docker.sock:/var/run/docker.sock
  caddy:
    image: caddy:2
    networks: [xingyao]
    ports:
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-logs:/var/log/caddy

networks:
  xingyao:
    name: xingyao

volumes:
  gateway-data:
  caddy-data:
  caddy-logs:
