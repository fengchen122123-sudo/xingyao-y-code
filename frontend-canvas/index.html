<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YCode Canvas</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #121212;
      }
    </style>
    <script>
      // Excalidraw 默认从 https://esm.sh 拉字体；指向站点自身目录以支持离线。
      // 用 document.baseURI 拼绝对路径：base 为 './' 时也能在被 iframe 挂到子路径下正常工作。
      window.EXCALIDRAW_ASSET_PATH = new URL('./', document.baseURI).href
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
