<!doctype html>
<html lang="zh-CN">
<head>
    <meta name="application-name" content="Y-CODE">
    <!-- img-src/media-src 放行 127.0.0.1 任意端口：助手消息媒体经 core/media_server
         的随机端口受控服务加载（内容寻址 Blob + 令牌鉴权，与 connect-src 的
         LAN 远程放行同一安全边界）；仅限本机回环，不放宽到任意主机 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://127.0.0.1:* http://localhost:*; media-src 'self' http://127.0.0.1:* http://localhost:*; connect-src 'self' ws://127.0.0.1:* http://127.0.0.1:*; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星瑶Code</title>
    <link rel="icon" href="/icon.png">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
