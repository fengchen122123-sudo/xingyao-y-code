# 已在生产验证的 nginx bot 路由段（2026-11-17 恢复自服务器备份
# /etc/nginx/bot-cleanup-backup/xingyaocode.pre-bot-cleanup，原样插入
# /etc/nginx/sites-available/xingyaocode 的 server 块内、/panel/ 之后）。
# 要点：
# - /xy/bot/ 剥前缀反代 18080，sub_filter 把旧 web SPA 的 /assets//api//ws//relay/
#   绝对路径改写回 /xy/bot/ 前缀（sub_filter 默认含 text/html，另列 JS/CSS/JSON）。
# - /xy/bot/m/ → 18080/m/，sub_filter 把移动端包构建期写死的 /m/ 绝对路径
#   改写为 /xy/bot/m/（vite base=/m/）。
# - 桌面页资源是 /desktop-assets/ 绝对路径（vite --base=/desktop-assets/ 构建），
#   不带子路径前缀，必须保留根级 /desktop-assets/、/desktop-shim.js、/icon.png。
# - 根级 /relay/ 是历史别名；桌面配置用 /xy/bot/relay/device。

    # ---- xingyao gateway subpath reverse proxy -> 127.0.0.1:18080 ----
    location = /xy/bot {
        return 301 /xy/bot/;
    }

    location /xy/bot/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 让 nginx 自己压缩：上游一旦 gzip，sub_filter 就不再改写
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter_types application/javascript text/javascript text/css application/json;
        sub_filter '"/assets/'  '"/xy/bot/assets/';
        sub_filter "'/assets/"  "'/xy/bot/assets/";
        sub_filter '`/assets/'  '`/xy/bot/assets/';
        sub_filter '"/api/'     '"/xy/bot/api/';
        sub_filter "'/api/"     "'/xy/bot/api/";
        sub_filter '`/api/'     '`/xy/bot/api/';
        sub_filter '"/ws/'      '"/xy/bot/ws/';
        sub_filter "'/ws/"      "'/xy/bot/ws/";
        sub_filter '`/ws/'      '`/xy/bot/ws/';
        sub_filter '"/relay/'   '"/xy/bot/relay/';
        sub_filter "'/relay/"   "'/xy/bot/relay/";
        sub_filter '`/relay/'   '`/xy/bot/relay/';
    }

    # ---- 移动端独立界面: /xy/bot/m/<device_id> ----
    location /xy/bot/m/ {
        # 把 /xy/bot/m/ 前缀换成 /m/，服务按 /m/<device_id> 与 /m/assets/ 提供页面
        proxy_pass http://127.0.0.1:18080/m/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter_types text/css application/javascript text/javascript application/json;
        sub_filter '"/m/'  '"/xy/bot/m/';
        sub_filter "'/m/"  "'/xy/bot/m/";
    }

    # ---- desktop remote page: /desktop/<device_id> + assets + relay websocket ----
    location /desktop/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /desktop-assets/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /desktop-shim.js {
        proxy_pass http://127.0.0.1:18080/desktop-shim.js;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /relay/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 桌面图标（远端页 splash / 侧栏 logo 走根路径 /icon.png）
    location = /icon.png {
        proxy_pass http://127.0.0.1:18080/icon.png;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
