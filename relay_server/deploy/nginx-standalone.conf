# 独立服务器 Nginx 反代模板（供个人域名或公网 IP 直接部署 relay_server 使用）
#
# 用法：
# 1. 有域名：将 server_name 改为你的域名，放开到 /etc/nginx/sites-available/ycode-relay
#    并软链到 sites-enabled，nginx -t && systemctl reload nginx，再执行：
#      sudo certbot --nginx -d <你的域名>
#    桌面端填写：wss://<你的域名>/relay/device
# 2. 仅公网 IP（无域名）：保留 server_name _; 监听 80 端口（需在云安全组放行 80），
#    桌面端填写：ws://<服务器IP>/relay/device（明文传输，建议后续绑定域名启用 HTTPS/WSS）。

server {
    listen 80;
    server_name _;

    # 健康检查
    location = /health {
        proxy_pass http://127.0.0.1:18080/health;
        proxy_set_header Host $host;
    }

    # 换票、设备注册与 Skill REST API
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 公网 MCP Streamable HTTP 入口（供手机智能体 amoo 等连接）
    location /mcp {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # WebSocket 中转通道（桌面 /relay/device 与手机 /relay/client）
    location /relay/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 独立移动端页面与资源（/m/<device_id>、/m/assets/*、/m/mobile-shim.js）
    location /m/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
    }

    # 桌面远端响应式页面（/desktop/<device_id>）
    location /desktop/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 桌面静态资源（同时兼容 --base=/desktop-assets/ 构建与安装包内置 frontend/dist 的 /assets/）
    location /desktop-assets/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /desktop-shim.js {
        proxy_pass http://127.0.0.1:18080/desktop-shim.js;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /icon.png {
        proxy_pass http://127.0.0.1:18080/icon.png;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
