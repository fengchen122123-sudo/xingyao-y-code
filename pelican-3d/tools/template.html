<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 移动端视口：禁止双指缩放，保证底部按钮触控稳定 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>鹈鹕 Pelly 骑单车 · 3D</title>
<!--
  本模板内不得出现任何外部域名 URL（SPEC §5 CSP 硬要求）：
  所有字体/图片/视频/脚本全部内联，媒体一律走运行时 blob URL。
-->
<style>
  /* ===================== 基础 ===================== */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b1a2b; color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  /* 画布容器：全屏铺满，OrbitControls 需要 touch-action:none */
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; outline: none; }

  /* ===================== 毛玻璃通用样式（SPEC §4） ===================== */
  .glass {
    background: rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 14px;
    box-shadow: 0 6px 22px rgba(4, 18, 38, 0.28);
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  }
  /* 键盘焦点可见 */
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid #ffe083;
    outline-offset: 2px;
  }

  /* ===================== 左上 HUD ===================== */
  #hud {
    position: fixed; left: 12px; top: 12px; z-index: 20;
    padding: 10px 13px; min-width: 178px;
    font-size: 13px; line-height: 1.75;
    pointer-events: none;   /* 不挡拖拽转视角 */
  }
  #hud .hud-title {
    font-size: 13px; font-weight: 700; letter-spacing: .5px;
    margin-bottom: 2px; opacity: .95;
  }
  #hud .row { display: flex; justify-content: space-between; gap: 14px; }
  #hud .k { opacity: .78; }
  #hud .v { font-variant-numeric: tabular-nums; font-weight: 700; }
  #hud-title-line { font-size: 12px; opacity: .8; margin-top: 4px; }

  /* 快捷键说明面板（≤700px 隐藏） */
  #shortcuts {
    position: fixed; left: 12px; top: 178px; z-index: 20;
    padding: 9px 12px; font-size: 11.5px; line-height: 1.8; max-width: 220px;
    pointer-events: none; opacity: .92;
  }
  #shortcuts b { font-weight: 700; }

  /* ===================== 中央 toast / 字幕 ===================== */
  #toast {
    position: fixed; left: 50%; top: 16%; transform: translate(-50%, -6px);
    z-index: 30; padding: 9px 18px; font-size: 14px; font-weight: 600;
    opacity: 0; transition: opacity .35s ease, transform .35s ease;
    pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #subtitle {
    position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%);
    z-index: 30; padding: 10px 16px; max-width: min(720px, 86vw);
    font-size: 14px; line-height: 1.6; text-align: center;
    opacity: 0; transition: opacity .4s ease; pointer-events: none;
  }
  #subtitle.show { opacity: 1; }

  /* ===================== 底部按钮（SPEC §4） =====================
     容器要求：position:fixed; left:0; right:0; margin:auto; width:fit-content
     （否则按钮换行会整体错位 —— §7 已知坑） */
  #controls {
    position: fixed; left: 0; right: 0; bottom: 14px; margin: auto;
    width: fit-content; z-index: 25;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    padding: 8px 10px;
    background: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.26);
    border-radius: 18px;
    max-width: calc(100vw - 20px);
  }
  #controls button {
    min-width: 62px; min-height: 44px;      /* 触控目标 ≥44px */
    padding: 6px 10px;
    font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1.2;
    color: #fff; cursor: pointer;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.32);
    border-radius: 12px;
    transition: background .18s ease, transform .12s ease;
    display: inline-flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 1px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
  }
  #controls button:hover { background: rgba(255, 255, 255, 0.3); }
  #controls button:active { transform: scale(0.95); }
  #controls button .ico { font-size: 17px; line-height: 1; }

  /* ===================== 开场页（SPEC §4） ===================== */
  #intro {
    position: fixed; inset: 0; z-index: 60;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; text-align: center; padding: 24px;
    background: #0b1a2b;
    transition: opacity .65s ease;
  }
  #intro.hidden { opacity: 0; pointer-events: none; }
  #intro-poster {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: .62; filter: saturate(1.05);
  }
  #intro .scrim {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(6, 24, 48, .18) 0%, rgba(6, 24, 48, .78) 78%);
  }
  #intro .intro-inner { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  #intro h1 {
    margin: 0; font-size: clamp(26px, 5.4vw, 52px); font-weight: 800; letter-spacing: 2px;
    text-shadow: 0 4px 22px rgba(0, 12, 32, .75);
  }
  #intro p.tag { margin: 0; font-size: clamp(12px, 1.8vw, 15px); opacity: .9; letter-spacing: 1px; }
  #start-btn {
    min-height: 52px; min-width: 168px; padding: 12px 30px;
    font-family: inherit; font-size: clamp(17px, 2.4vw, 21px); font-weight: 800; letter-spacing: 2px;
    color: #123; cursor: pointer;
    background: linear-gradient(180deg, #ffe9a8, #ffc94d);
    border: 0; border-radius: 999px;
    box-shadow: 0 10px 26px rgba(255, 190, 60, .38), inset 0 -3px 0 rgba(160, 110, 0, .35);
    transition: transform .14s ease, box-shadow .2s ease;
  }
  #start-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(255, 190, 60, .5), inset 0 -3px 0 rgba(160, 110, 0, .35); }
  #start-btn:active { transform: translateY(0) scale(.97); }

  /* ===================== 移动端（≤700px）：隐藏快捷键面板与标题 ===================== */
  @media (max-width: 700px) {
    #shortcuts { display: none; }
    .hud-title, #hud-title-line { display: none !important; }
    #hud { min-width: 0; font-size: 12px; padding: 8px 10px; }
    #controls { bottom: 8px; gap: 6px; padding: 6px; border-radius: 16px; }
    #controls button { min-width: 52px; min-height: 46px; font-size: 11px; padding: 4px 6px; }
    #controls button .ico { font-size: 16px; }
    #subtitle { bottom: 132px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #intro, #toast, #subtitle, #controls button { transition: none; }
  }
</style>
</head>
<body>

<!-- 3D 画布容器 -->
<div id="stage"></div>

<!-- 左上 HUD：速度 / 里程 / 圈数 / 按铃次数 / 当前镜头 -->
<div id="hud" class="glass" role="status" aria-live="polite">
  <div class="hud-title">鹈鹕 Pelly 骑单车</div>
  <div class="row"><span class="k">速度</span><span class="v"><span id="hud-speed">0.0</span> km/h</span></div>
  <div class="row"><span class="k">里程</span><span class="v"><span id="hud-dist">0</span> m</span></div>
  <div class="row"><span class="k">圈数</span><span class="v" id="hud-lap">0</span></div>
  <div class="row"><span class="k">按铃</span><span class="v" id="hud-bell">0</span> 次</div>
  <div class="row"><span class="k">镜头</span><span class="v" id="hud-cam">1 自由环绕</span></div>
  <div id="hud-title-line">拖动屏幕转视角</div>
</div>

<!-- 快捷键说明（≤700px 隐藏） -->
<div id="shortcuts" class="glass">
  <b>空格</b> 按铃 &nbsp;·&nbsp; <b>↑/↓ 或 W/S</b> 加减速<br>
  <b>J</b> 翘头 &nbsp;·&nbsp; <b>C 或 1-4</b> 镜头<br>
  <b>N</b> 昼夜 &nbsp;·&nbsp; <b>M</b> 音乐 &nbsp;·&nbsp; <b>V</b> 语音
</div>

<!-- 中央提示 -->
<div id="toast" class="glass" role="status" aria-live="polite"></div>

<!-- 配音字幕（audio.js 降级时派发 pelican-subtitle 事件，这里显示 detail.text） -->
<div id="subtitle" class="glass" role="status" aria-live="polite"></div>

<!-- 屏幕底部按钮：与键盘同等功能，触控目标 ≥44px -->
<div id="controls" role="group" aria-label="骑行控制">
  <button type="button" data-act="bell" aria-label="按铃"><span class="ico">🔔</span>按铃</button>
  <button type="button" data-act="faster" aria-label="加速"><span class="ico">⬆️</span>加速</button>
  <button type="button" data-act="slower" aria-label="减速"><span class="ico">⬇️</span>减速</button>
  <button type="button" data-act="wheelie" aria-label="翘头"><span class="ico">🤸</span>翘头</button>
  <button type="button" data-act="cam" aria-label="切换镜头"><span class="ico">🎥</span>镜头</button>
  <button type="button" data-act="night" aria-label="切换昼夜"><span class="ico">🌙</span>昼夜</button>
  <button type="button" id="btn-music" data-act="music" aria-label="音乐开关" aria-pressed="true"><span class="ico">🎵</span>音乐</button>
  <button type="button" data-act="speak" aria-label="重播语音"><span class="ico">🗣️</span>语音</button>
</div>

<!-- 开场页：海报背景 + 标题 + 出发按钮 -->
<div id="intro">
  <!-- 海报 src 由 main.js 用内联 data URL 赋值（模板内不出现任何外部 URL） -->
  <img id="intro-poster" alt="" aria-hidden="true">
  <div class="scrim"></div>
  <div class="intro-inner">
    <h1>鹈鹕 Pelly 骑单车</h1>
    <p class="tag">海岛环岛赛道 · 拖动转视角 · 空格按铃</p>
    <button type="button" id="start-btn">出发！</button>
  </div>
</div>

<script>
/*__ASSETS__*/
/*__BUNDLE__*/
</script>
</body>
</html>
