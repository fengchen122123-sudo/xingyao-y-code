<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>星瑶</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #5f5f5f;
    --line: #e7e7e4;
    --soft: #f4f4f2;
    --paper: #f7f7f5;
    --fill: #171717;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background: #fff;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  button, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--fill); outline-offset: 3px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  .switch {
    position: fixed; z-index: 5; top: 14px; right: 14px;
    display: flex; padding: 3px; border: 1px solid var(--line);
    border-radius: 999px; background: #fff;
  }
  .switch button {
    border: 0; background: transparent; color: var(--muted);
    border-radius: 999px; padding: 5px 12px; font-size: 12px;
  }
  .switch button[aria-pressed="true"] { background: var(--fill); color: #fff; }

  .frame { height: 100%; }
  body.phone { background: var(--paper); overflow: hidden; padding: 20px 0; }
  body.phone .frame {
    width: 390px;
    height: 100%;
    margin: 0 auto;
    border: 1px solid var(--line);
    border-radius: 28px;
    overflow: hidden;
    background: #fff;
  }

  .app { height: 100%; display: flex; background: #fff; min-height: 0; }
  .side {
    width: 248px; flex: none; background: var(--paper);
    display: flex; flex-direction: column; padding: 18px 12px 12px; min-height: 0;
  }
  .side-head, .top-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .side-head { padding: 2px 10px 16px; }
  .mark { font-weight: 650; letter-spacing: -0.03em; }
  .text-btn {
    border: 0; background: none; padding: 6px 2px; font-size: 13px; color: var(--ink);
  }
  .chats { overflow: auto; display: flex; flex-direction: column; gap: 2px; }
  .chat-btn, .side-link {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; text-align: left; border: 0; background: transparent;
    border-radius: 8px; padding: 9px 10px;
  }
  .chat-btn:hover, .side-link:hover { background: #eeeee9; }
  .chat-btn.active { background: #e6e6e1; }
  .chat-btn span, .device b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-btn time, .side-link.quiet, .when { color: var(--muted); font-size: 12px; flex: none; }
  .side-foot { margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .transcript { flex: 1; overflow: auto; padding: 28px 32px 8px; }
  .column { max-width: 640px; margin: 0 auto; }
  .doc-title { font-size: 15px; font-weight: 650; margin: 4px 0 26px; }
  .back { border: 0; background: none; padding: 0 0 8px; color: var(--muted); font-size: 14px; }
  .note, .empty, .warn, .watch, .ask.done { color: var(--muted); }
  .note { font-size: 13px; margin: -14px 0 22px; }
  .empty { margin: 8px 0 0; }
  .warn { font-size: 13px; margin: 14px 0 0; }

  .msg { margin: 0 0 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user {
    margin-left: auto; width: fit-content; max-width: min(78%, 460px);
    background: var(--soft); border-radius: 16px; padding: 10px 14px;
  }
  .msg.agent { max-width: 62ch; }
  .watch {
    display: block; margin-top: 10px; padding: 0; border: 0; background: none;
    color: var(--muted); font-size: 13px; text-align: left;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .shot {
    margin-top: 10px; padding: 16px; border-radius: 12px; background: var(--paper);
  }
  .shot b { display: block; font-size: 14px; font-weight: 650; }
  .shot span { color: var(--muted); font-size: 13px; }
  .ask { margin: 14px 0 0; }
  .choices { display: flex; gap: 8px; margin-top: 10px; }
  .choices button {
    min-height: 36px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; font-size: 14px;
  }
  .choices .yes { background: var(--fill); color: #fff; border-color: var(--fill); }

  .dock { padding: 8px 32px 22px; }
  .composer {
    max-width: 640px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    border: 1px solid #dededb; border-radius: 14px; padding: 8px 8px 8px 14px;
  }
  .composer:focus-within { border-color: var(--fill); }
  .composer textarea {
    flex: 1; border: 0; resize: none; background: transparent; outline: none;
    min-height: 28px; max-height: 140px; padding: 6px 0; line-height: 1.5; font-size: 15px;
  }
  .composer button {
    border: 0; background: var(--fill); color: #fff; border-radius: 10px;
    min-width: 64px; height: 36px; font-size: 14px;
  }
  .composer button:disabled { background: var(--soft); color: #8d8d8d; }

  .page-title { font-size: 15px; font-weight: 650; margin: 4px 0 8px; }
  .lead { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
  .device {
    width: 100%; display: flex; justify-content: space-between; gap: 16px;
    padding: 14px 0; border: 0; border-bottom: 1px solid var(--line);
    background: none; text-align: left;
  }
  .device b { font-weight: 600; }
  .device span { color: var(--muted); font-size: 13px; flex: none; }
  .device.off { color: var(--muted); }

  .login { max-width: 320px; margin: 16vh auto 0; padding: 0 24px; }
  .login h1 { font-size: 28px; line-height: 1.2; letter-spacing: -0.04em; margin: 0 0 8px; }
  .login p { margin: 0; color: var(--muted); font-size: 14px; }
  .login label { display: block; margin: 18px 0 6px; font-size: 13px; }
  .login input {
    width: 100%; border: 1px solid #dededb; border-radius: 10px; padding: 10px 12px; background: #fff;
  }
  .login input:focus { border-color: var(--fill); }
  .login button, .block-btn {
    width: 100%; height: 42px; margin-top: 18px; border: 0; border-radius: 10px;
    background: var(--fill); color: #fff;
  }
  .account p { margin: 6px 0 0; color: var(--muted); }
  .account .block-btn { max-width: 240px; background: #fff; color: var(--ink); border: 1px solid var(--line); }

  .app.narrow .side { width: 100%; background: #fff; }
  .app.narrow.hide-side .side { display: none; }
  .app.narrow.hide-main .main { display: none; }
  .app.narrow .transcript, .app.narrow .dock { padding-left: 18px; padding-right: 18px; }

  @media (max-width: 720px) {
    .switch { display: none; }
    body.phone { background: #fff; }
    body.phone .frame { width: auto; height: 100%; margin: 0; border: 0; border-radius: 0; }
  }
</style>
</head>
<body>
  <div class="switch" role="group" aria-label="预览宽度">
    <button type="button" id="wideBtn" aria-pressed="true">桌面</button>
    <button type="button" id="phoneBtn" aria-pressed="false">手机</button>
  </div>
  <div class="frame">
    <div class="app" id="app"></div>
  </div>
  <div id="live" class="sr-only" role="status"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const live = (t) => { $('#live').textContent = t; };

const chats = [
  {
    id: 'week', title: '本周进展', when: '今天', approval: 'pending', watchOpen: false,
    items: [
      { role: 'user', text: '帮我整理这周的进展，看看核心功能和浏览器自动化。' },
      {
        role: 'agent',
        text: '看过这周的记录，也打开了产品页。\n\n核心功能按计划，对话和确认已经连上。\n浏览器能打开页面、读取内容。',
        watch: '产品首页',
        ask: '要存成 reports/2026-11-13.md 吗？'
      }
    ]
  },
  {
    id: 'compete', title: '竞品首启', when: '昨天', approval: null, watchOpen: false,
    items: [
      { role: 'user', text: '对比一下三个产品第一次打开时在做什么。' },
      { role: 'agent', text: '都是先给一件马上能做完的小事，而不是先介绍功能。' }
    ]
  },
  {
    id: 'month', title: '月度数据', when: '11月11日', approval: null, watchOpen: false,
    items: [
      { role: 'user', text: '汇总一下十一月。' },
      { role: 'agent', text: '活跃 18 天，完成 46 项。' }
    ]
  },
  {
    id: 'migrate', title: '迁移清单', when: '11月8日', approval: null, watchOpen: false,
    items: [
      { role: 'user', text: '服务器迁移前要检查什么？' },
      { role: 'agent', text: '数据、密钥、回调地址、回滚。按这个顺序做。' }
    ]
  }
];

const devices = [
  { id: 'home', name: '家里的台式机', online: true },
  { id: 'studio', name: '工作室电脑', online: false }
];

const threads = {
  home: { items: [] },
  studio: { items: [] }
};

const state = {
  previewPhone: location.hash === '#phone',
  screen: 'chat',
  chatId: 'week',
  deviceId: null,
  loggedIn: true,
  account: '木偶',
  notice: '',
  focus: false,
  bottom: true
};

const smallScreen = matchMedia('(max-width: 720px)');
const narrow = () => state.previewPhone || smallScreen.matches;
const chat = () => chats.find((c) => c.id === state.chatId);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function goBack() {
  if (state.screen === 'device') state.screen = 'computers';
  else if (narrow() && state.screen !== 'list') state.screen = 'list';
  else state.screen = 'chat';
  state.notice = '';
  render();
}

function render() {
  const isNarrow = narrow();
  document.body.classList.toggle('phone', state.previewPhone && !smallScreen.matches);
  $('#wideBtn').setAttribute('aria-pressed', String(!state.previewPhone));
  $('#phoneBtn').setAttribute('aria-pressed', String(state.previewPhone));
  $('#wideBtn').classList.toggle('active', !state.previewPhone);

  const hideSide = !state.loggedIn || (isNarrow && state.screen !== 'list');
  const hideMain = state.loggedIn && isNarrow && state.screen === 'list';
  const app = $('#app');
  app.className = 'app' + (isNarrow ? ' narrow' : '') + (hideSide ? ' hide-side' : '') + (hideMain ? ' hide-main' : '');
  app.innerHTML = sideHtml(isNarrow) + mainHtml(isNarrow);

  const box = $('#box');
  if (box) {
    box.addEventListener('input', () => {
      box.style.height = 'auto';
      box.style.height = Math.min(box.scrollHeight, 140) + 'px';
      $('#send').disabled = !box.value.trim();
    });
    if (state.focus) box.focus();
  }
  const scroller = $('.transcript');
  if (scroller && state.bottom) scroller.scrollTop = scroller.scrollHeight;
  state.focus = false;
  state.bottom = false;
}

function sideHtml() {
  if (!state.loggedIn) return '';
  const items = chats.map((c) => `
    <button class="chat-btn${c.id === state.chatId && state.screen === 'chat' ? ' active' : ''}" data-chat="${c.id}"${c.id === state.chatId && state.screen === 'chat' ? ' aria-current="page"' : ''}>
      <span>${esc(c.title)}</span><time>${esc(c.when)}</time>
    </button>`).join('');
  return `
    <aside class="side">
      <div class="side-head">
        <div class="mark">星瑶</div>
        <button class="text-btn" data-action="new" type="button">新对话</button>
      </div>
      <nav class="chats" aria-label="对话">${items}</nav>
      <div class="side-foot">
        <button class="side-link" data-action="computers" type="button">我的电脑</button>
        <button class="side-link quiet" data-action="account" type="button">${esc(state.account)}</button>
      </div>
    </aside>`;
}

function mainHtml(isNarrow) {
  if (!state.loggedIn) return loginHtml();
  if (isNarrow && state.screen === 'list') return '<main class="main"></main>';
  let body = '';
  if (state.screen === 'chat') body = chatHtml(chat(), isNarrow, false);
  else if (state.screen === 'computers') body = computersHtml(isNarrow);
  else if (state.screen === 'device') body = deviceHtml(isNarrow);
  else if (state.screen === 'account') body = accountHtml(isNarrow);
  return `<main class="main">${body}</main>`;
}

function backBtn(isNarrow, show) {
  if (!show && !isNarrow) return '';
  if (!isNarrow && !show) return '';
  return '<button class="back" type="button" data-action="back">返回</button>';
}

function chatHtml(c, isNarrow, remote) {
  const showBack = isNarrow || remote;
  const pending = c && c.approval === 'pending';
  const title = remote ? devices.find((d) => d.id === state.deviceId).name : c.title;
  const note = remote ? '<p class="note">消息会原样转发到这台电脑。</p>' : '';
  const stop = pending ? '<button class="text-btn" type="button" data-action="stop">停止</button>' : '';
  const items = (c ? c.items : threads[state.deviceId].items);
  const messages = items.length
    ? items.map((m, i) => messageHtml(m, i, c)).join('')
    : (remote ? '' : '<p class="empty">直接说你要做的事。</p>');
  return `
    <div class="transcript"><div class="column">
      ${backBtn(isNarrow, showBack)}
      <div class="doc-title top-row"><span>${esc(title)}</span>${stop}</div>
      ${note}
      ${messages}
    </div></div>
    ${composerHtml()}`;
}

function messageHtml(m, index, c) {
  const klass = m.role === 'user' ? 'user' : 'agent';
  let extra = '';
  if (m.watch) {
    extra += `<button class="watch" type="button" data-watch="${index}">看过${esc(m.watch)}</button>`;
    if (c.watchOpen) extra += `<div class="shot"><b>${esc(m.watch)}</b><span>已打开并读取</span></div>`;
  }
  if (m.ask && c) {
    if (c.approval === 'pending') {
      extra += `<p class="ask">${esc(m.ask)}</p><div class="choices"><button type="button" data-action="deny">先不存</button><button class="yes" type="button" data-action="allow">存下来</button></div>`;
    } else if (c.approval === 'allowed') extra += '<p class="ask done">已存成 reports/2026-11-13.md</p>';
    else if (c.approval === 'denied') extra += '<p class="ask done">没有保存。</p>';
    else if (c.approval === 'stopped') extra += '<p class="ask done">已停止，没有保存。</p>';
  }
  return `<div class="msg ${klass}">${esc(m.text)}${extra}</div>`;
}

function composerHtml() {
  return `
    <form class="dock" id="composer">
      <div class="composer">
        <label class="sr-only" for="box">消息</label>
        <textarea id="box" rows="1" placeholder="说一件事"></textarea>
        <button id="send" type="submit" disabled>发送</button>
      </div>
    </form>`;
}

function computersHtml(isNarrow) {
  const rows = devices.map((d) => `
    <button class="device${d.online ? '' : ' off'}" type="button" data-device="${d.id}">
      <b>${esc(d.name)}</b><span>${d.online ? '在线' : '没开'}</span>
    </button>`).join('');
  return `
    <div class="transcript"><div class="column">
      ${backBtn(isNarrow, true)}
      <h1 class="page-title">我的电脑</h1>
      <p class="lead">选一台开着的电脑。服务器只负责转发。</p>
      ${rows}
      ${state.notice ? `<p class="warn">${esc(state.notice)}</p>` : ''}
    </div></div>`;
}

function deviceHtml(isNarrow) {
  const t = threads[state.deviceId];
  return chatHtml({ title: '', approval: null, items: t.items, watchOpen: false }, isNarrow, true);
}

function accountHtml(isNarrow) {
  return `
    <div class="transcript"><div class="column account">
      ${backBtn(isNarrow, true)}
      <h1 class="page-title">账号</h1>
      <p>${esc(state.account)}</p>
      <p>这个账号里的对话只属于你。</p>
      <button class="block-btn" type="button" data-action="logout">退出</button>
    </div></div>`;
}

function loginHtml() {
  return `
    <main class="main"><form class="login" id="login">
      <h1>星瑶</h1>
      <p>用账号把对话分开。</p>
      <label for="who">账号</label>
      <input id="who" name="who" autocomplete="username" value="木偶" required>
      <label for="pass">密码</label>
      <input id="pass" name="pass" type="password" autocomplete="current-password" placeholder="原型里随便填" required>
      <button type="submit">进入</button>
    </form></main>`;
}

function send(text) {
  const clean = text.trim();
  if (!clean) return;
  if (state.screen === 'device') {
    const t = threads[state.deviceId];
    t.items.push({ role: 'user', text: clean });
    t.items.push({ role: 'agent', text: '已转发到这台电脑。它在本机执行，服务器不看内容。' });
  } else {
    const c = chat();
    if (c.title === '新对话') {
      c.title = clean.length > 16 ? clean.slice(0, 16) + '…' : clean.split('\n')[0];
      c.when = '刚刚';
    }
    c.items.push({ role: 'user', text: clean });
    c.items.push({ role: 'agent', text: '收到。要改文件或访问外部时，我会先问你。' });
  }
  state.bottom = true;
  state.focus = true;
  render();
}

$('#app').addEventListener('click', (e) => {
  const chatBtn = e.target.closest('[data-chat]');
  if (chatBtn) {
    state.chatId = chatBtn.dataset.chat;
    state.screen = 'chat';
    state.bottom = true;
    render();
    return;
  }
  const deviceBtn = e.target.closest('[data-device]');
  if (deviceBtn) {
    const d = devices.find((x) => x.id === deviceBtn.dataset.device);
    if (!d.online) {
      state.notice = '这台电脑没开。';
      live(state.notice);
      render();
      return;
    }
    state.deviceId = d.id;
    state.screen = 'device';
    state.notice = '';
    state.bottom = true;
    render();
    return;
  }
  const watch = e.target.closest('[data-watch]');
  if (watch) {
    const c = chat();
    c.watchOpen = !c.watchOpen;
    render();
    return;
  }
  const action = e.target.closest('[data-action]');
  if (!action) return;
  const name = action.dataset.action;
  if (name === 'new') {
    const id = 'c' + Date.now();
    chats.unshift({ id, title: '新对话', when: '刚刚', approval: null, watchOpen: false, items: [] });
    state.chatId = id;
    state.screen = 'chat';
    state.focus = true;
    render();
  } else if (name === 'computers') {
    state.screen = 'computers';
    state.notice = '';
    render();
  } else if (name === 'account') {
    state.screen = 'account';
    render();
  } else if (name === 'back') goBack();
  else if (name === 'allow' || name === 'deny' || name === 'stop') {
    const c = chat();
    c.approval = name === 'allow' ? 'allowed' : name === 'deny' ? 'denied' : 'stopped';
    live(name === 'allow' ? '已保存' : name === 'deny' ? '没有保存' : '已停止');
    render();
  } else if (name === 'logout') {
    state.loggedIn = false;
    state.screen = 'login';
    render();
  }
});

$('#app').addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'login') {
    state.account = $('#who').value.trim() || '木偶';
    state.loggedIn = true;
    state.screen = narrow() ? 'list' : 'chat';
    live('已进入 ' + state.account);
    render();
    return;
  }
  if (e.target.id === 'composer') send($('#box').value);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.screen !== 'chat' && state.screen !== 'list') goBack();
  if (e.target.id === 'box' && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send(e.target.value);
  }
});

$('#wideBtn').addEventListener('click', () => { state.previewPhone = false; if (state.screen === 'list') state.screen = 'chat'; render(); });
$('#phoneBtn').addEventListener('click', () => { state.previewPhone = true; render(); });
smallScreen.addEventListener('change', () => {
  if (smallScreen.matches && state.screen === 'chat') state.screen = 'list';
  render();
});

if (smallScreen.matches) state.screen = 'list';
render();
</script>
</body>
</html>
