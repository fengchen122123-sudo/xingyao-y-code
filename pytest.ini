[pytest]
addopts =
testpaths = tests
norecursedirs = mytemp .pytest_cache .git .venv venv node_modules dist build .superpowers
faulthandler_timeout = 120
# 慢测试标记：依赖真实 git 子进程的用例在 Windows 上每次子进程启动约 6 秒
# （实测 tests/test_git_cli.py::test_cmd_status_clean 单测 66s），单文件即需
# 数分钟。默认仍会运行（保证覆盖率）；需要快速回归时用 `pytest -m "not slow"`。
markers =
    slow: 依赖真实 git 子进程的慢测试（Windows 本机约 6s/次子进程）
